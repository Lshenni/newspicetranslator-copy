# Passive Component Parameter Mappings
# Mappings for resistor, capacitor, and inductor parameters
# Format: parameter_name -> {format: {target, confidence, notes}}

# =============================================================================
# RESISTOR PARAMETERS
# =============================================================================

# Basic Value
r:
  spectre:
    target: r
    confidence: high
    notes: "Resistance value"
  hspice:
    target: r
    confidence: high
  ngspice:
    target: r
    confidence: high
  aliases: [resistance]

# Temperature Coefficients
tc1:
  spectre:
    target: tc1
    confidence: high
    notes: "First-order temperature coefficient"
  hspice:
    target: tc1
    confidence: high
  ngspice:
    target: tc1
    confidence: high
  aliases: [tc, tcr]

tc2:
  spectre:
    target: tc2
    confidence: high
    notes: "Second-order temperature coefficient"
