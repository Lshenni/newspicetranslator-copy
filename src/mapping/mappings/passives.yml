  hspice:
    target: trise
    confidence: medium
  ngspice:
    target: trise
    confidence: low
    notes: "May not be supported in all ngspice versions"
  aliases: []

# Polynomial Coefficients
coeffs:
  spectre:
    target: coeffs
    confidence: medium
