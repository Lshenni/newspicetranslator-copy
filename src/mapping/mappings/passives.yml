    target: c
    confidence: medium
    notes: "May need custom scaling"
  ngspice:
    target: c
    confidence: medium
    notes: "May need custom scaling"
  aliases: []

# Rise Time (for MIM capacitors)
trise:
  spectre:
    target: trise
