  hspice:
    target: poly
    confidence: medium
    notes: "HSPICE uses poly syntax"
  ngspice:
    target: poly
    confidence: low
    notes: "Polynomial coefficients may have different syntax"
  aliases: [poly]

# Parasitic Resistance
r:
