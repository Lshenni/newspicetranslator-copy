# Capacitor Parameter Mappings for SPICE Formats
# This file contains mappings for capacitor model parameters across Spectre, HSPICE, and ngspice

# Basic capacitance value
c:
  spectre:
    target: c
    confidence: high
  hspice:
    target: c
    confidence: high
  ngspice:
    target: c
    confidence: high

# Temperature coefficients
tc1:
  spectre:
    target: tc1
    confidence: high
  hspice:
    target: tc1
    confidence: high
  ngspice:
    target: tc1
    confidence: high

tc2:
  spectre:
    target: tc2
    confidence: high
  hspice:
    target: tc2
    confidence: high
  ngspice:
    target: tc2
    confidence: high

# Junction capacitance
cj:
  spectre:
    target: cj
    confidence: medium
  hspice:
    target: cj
    confidence: medium
  ngspice:
    target: cj
    confidence: medium

# Junction sidewall capacitance
cjsw:
  spectre:
    target: cjsw
    confidence: medium
  hspice:
    target: cjsw
    confidence: medium
  ngspice:
    target: cjsw
    confidence: medium

# Rise time parameter (for MIM capacitors)
trise:
  spectre:
    target: trise
    confidence: medium
  hspice:
    target: trise
    confidence: medium
  ngspice:
    target: trise
    confidence: low
    note: "May not be supported in all ngspice versions"

# Polynomial coefficients for temperature/voltage dependence
coeffs:
  spectre:
    target: coeffs
    confidence: medium
  hspice:
    target: poly
    confidence: medium
  ngspice:
    target: poly
    confidence: low
    note: "Polynomial coefficients may have different syntax"

# MIM capacitor specific parameters
cmim_para_b:
  spectre:
    target: cmim_para_b
    confidence: high
  hspice:
    target: c
    confidence: medium
    note: "May need custom scaling"
  ngspice:
    target: c
    confidence: medium
    note: "May need custom scaling"

# Nominal temperature
tnom:
  spectre:
    target: tnom
    confidence: high
  hspice:
    target: tnom
    confidence: high
  ngspice:
    target: tnom
    confidence: high

# Width and length parameters (for layout-dependent capacitors)
w:
  spectre:
    target: w
    confidence: high
  hspice:
    target: w
    confidence: high
  ngspice:
    target: w
    confidence: high

l:
  spectre:
    target: l
    confidence: high
  hspice:
    target: l
    confidence: high
  ngspice:
    target: l
    confidence: high

# Resistance parameter (for lossy capacitors)
r:
  spectre:
    target: r
    confidence: medium
  hspice:
    target: r
    confidence: medium
  ngspice:
    target: r
    confidence: medium

# Scale factor parameters
mimfactor:
  spectre:
    target: mimfactor
    confidence: high
  hspice:
    target: m
    confidence: medium
    note: "Scale factor mapping"
  ngspice:
    target: m
    confidence: medium
    note: "Scale factor mapping"

mimfactor_b:
  spectre:
    target: mimfactor_b
    confidence: high
  hspice:
    target: m
    confidence: medium
    note: "Scale factor mapping"
  ngspice:
    target: m
    confidence: medium
    note: "Scale factor mapping"