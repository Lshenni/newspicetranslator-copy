# BJT (Bipolar Junction Transistor) Parameter Mappings
# Maps parameter names across different SPICE formats for BJT devices
# Format: param_name -> {format: {target: name, confidence: level}}

# Core BJT Parameters
is:           # Saturation current
  ngspice:
    target: "is"
    confidence: high
    notes: "Transport saturation current"
    
